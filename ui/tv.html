<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SongGrabber Karaoke</title>
<link rel="stylesheet" href="app.css">
<style>
  html,body{background:#000;height:100%;margin:0;overflow:hidden}
  .tv{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .tv video{width:100%;height:100%;object-fit:contain;background:#000}
  .tv .ka-over{font-size:3.4vh;top:4vh;padding:1vh 3vh}
  .tv .ka-over small{font-size:2vh}
  .tv .ka-score{font-size:2.3vh}
  .tv-idle{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;color:#fff;font:600 3vh var(--disp);text-align:center;background:radial-gradient(ellipse at 50% 40%,#2a1a10 0%,#000 70%)}
  .tv-idle svg{width:9vh;height:9vh;stroke:var(--accent);stroke-width:1.4}
  .tv-idle small{font:400 1.8vh var(--font);color:var(--muted)}
  body.idle,body.idle *{cursor:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="i-stage" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 10.5a6.5 6.5 0 0 0 13 0M12 17v4.5M8.5 21.5h7"/></symbol></svg>
<div class="tv">
  <video id="tvVideo" playsinline crossorigin="anonymous"></video>
  <div class="ka-over" id="tvOver"></div>
  <div id="tvScore"></div>
  <div class="tv-idle" id="tvIdle"><svg><use href="#i-stage"/></svg><span id="tvIdleT">Gleich geht's los …</span><small id="tvIdleS">Der nächste Song startet auf diesem Bildschirm.</small></div>
</div>
<script src="i18n.js"></script>
<script src="pitch.js"></script>
<script>
"use strict";
/* Fernseher-Fenster: spielt das Karaoke-Video im Vollbild. Gesteuert wird alles aus dem Hauptfenster. */
const TV = (() => {
  const v = document.getElementById("tvVideo"), over = document.getElementById("tvOver"), idle = document.getElementById("tvIdle");
  let overT = 0, idleT = 0, pitch = 0;
  function send(ev) {
    const st = { t: v.currentTime || 0, d: isFinite(v.duration) ? v.duration : 0, paused: v.paused, ended: v.ended };
    if (window.pywebview && pywebview.api && pywebview.api.kara_tv_event) pywebview.api.kara_tv_event(ev, st).catch(() => { });
    else if (window.opener) window.opener.postMessage({ sgtv: ev, st }, "*");
  }
  ["playing", "pause", "seeking", "loadedmetadata", "waiting", "ended", "error"].forEach(ev => v.addEventListener(ev, () => send(ev)));
  let lastT = 0;
  v.addEventListener("timeupdate", () => { const n = performance.now(); if (n - lastT > 240) { lastT = n; send("timeupdate"); } });
  v.addEventListener("playing", () => { idle.hidden = true; });
  async function cmd(c) {
    if (!c) return;
    if (c.lang) I18N.set(c.lang);
    if (c.src !== undefined) {
      if (!c.src) { v.pause(); v.removeAttribute("src"); v.load(); idle.hidden = false; }
      else {
        if (v.getAttribute("src") !== c.src) { v.src = c.src; }
        if (c.rate) { v.defaultPlaybackRate = c.rate; v.playbackRate = c.rate; }
        if (c.t) { const go = () => { v.currentTime = c.t; }; v.readyState >= 1 ? go() : v.addEventListener("loadedmetadata", go, { once: true }); }
        if (c.play) v.play().catch(() => { });
      }
    }
    if (c.idle) { document.getElementById("tvIdleT").textContent = c.idle; idle.hidden = false; }
    if (c.play && c.src === undefined) v.play().catch(() => { });
    if (c.pause) v.pause();
    if (c.seek !== undefined) v.currentTime = c.seek;
    if (c.vol !== undefined) v.volume = c.vol;
    if (c.muted !== undefined) v.muted = c.muted;
    if (c.rate !== undefined) { v.preservesPitch = true; v.defaultPlaybackRate = c.rate; v.playbackRate = c.rate; }
    if (c.pitch !== undefined && c.pitch !== pitch) { pitch = c.pitch; await KPitch.set(v, pitch); }
    if (c.over) { clearTimeout(overT); over.innerHTML = c.over.html; over.classList.add("on"); if (c.over.ms) overT = setTimeout(() => over.classList.remove("on"), c.over.ms); }
    if (c.overOff) over.classList.remove("on");
    if (c.score !== undefined) document.getElementById("tvScore").innerHTML = c.score || "";
  }
  window.addEventListener("message", e => { if (e.data && e.data.sgcmd) cmd(e.data.sgcmd); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") send("esc"); });
  document.addEventListener("mousemove", () => { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add("idle"), 2000); });
  v.addEventListener("dblclick", () => send("esc"));
  return { cmd, send };
})();
window.TV = TV;
I18N.start();
window.addEventListener("pywebviewready", () => TV.send("ready"));
if (!window.pywebview && window.opener) setTimeout(() => TV.send("ready"), 50);
</script>
</body>
</html>
